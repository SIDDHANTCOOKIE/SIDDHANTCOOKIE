name: contribution quest

# Keeps the Contribution Quest section of the profile README current.
# GitHub gives this repo no push signal when a PR merges in someone else's
# org, so we poll: hourly at :23 past the hour, plus a manual
# "Run workflow" button (workflow_dispatch). Each run fetches every merged
# PR authored by SIDDHANTCOOKIE, re-classifies them into the four paths,
# rewrites the section between the contribution-quest markers and commits
# only if something changed.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: regenerate quest section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/quest/generate.py README.md
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "quest: refresh merged prs"
            git push
          else
            echo "no changes"
          fi
